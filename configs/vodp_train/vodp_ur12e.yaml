defaults:
  - vodp_base
  - _self_
  # UR12e real libero spatial: two RGB streams + 7-DoF state/action
n_obs_steps: 1

shape_meta:
  obs:
    observation.images.image:
      shape: ${image_shape}
      type: rgb
    observation.images.wrist_image:
      shape: ${image_shape}
      type: rgb
    observation.state:
      shape: [7]
      type: low_dim
  action:
    shape: [7]

image_shape: [3, 240, 320]  # Reduced from [3, 480, 640] for faster training
output_dir: "checkpoints/vodp_ur12e_${train_dataset.demo}"
mixed_precision: "bf16"
train_batch_size: 48
gradient_accumulation_steps: 16

model:
  obs_encoder:
    out_channels: 526
    rgb_key: ['observation.images.image', 'observation.images.wrist_image']
    state_key: 'observation.state'
    emvis_config:
      dim_2d: null
      dim_3d_keys: ['frame', 'global']
      load_vggt_heads: true
      load_vggt_pretrain: true
      vggt_model_path: pretrained/VGGT-1B/model.pt
      interpolate: 'bilinear'
      mlp_ratio: 1.0
      drop_p: 0.0
      ft_heads: []
      ft_layer_idx: []
      intermediate_layer_idx: [23]
      seq_as_view: False
      only_first_view: True
      injector_config:
        fuse_2d: True
        fuse_3d: False
        ffn_layer_num: 1
        dim_out: 1024
      model_adapter_config:
        target: ResNetAdapter
        shape_out: [1, 1]
        dim_out: 1024
        conv_num: 3
      mv_fuser_config: {}
  out_channels: 1031

