server:
  host: "0.0.0.0"
  port: 8547

model:
  checkpoint_dir: "/root/workspace/vla_ckpt/vodp-ur12e-small-100-checkpoint_40000"
  mixed_precision: "bf16"  # 计算精度: bf16|fp16|fp32
  device: "cuda"           # 运行设备: cuda|cpu

client:
  server_host: "127.0.0.1"
  server_port: 8547
  send_freq: 10
  max_steps: 1000
  action_timeout: 5.0
  log_dir: "./real_logs"

# 机器人硬件配置
datacenter:
  arms:
    right_arm:
      base_topic: "/right_arm/manip_t/controller"
      dof: 6

  cameras:
    wrist_right:
      base_topic: "/right_arm/manip_t/sensor/camera"
      streams:
        rgb: true
        depth: false
    front:
      base_topic: "/embodied/front/manip_t/sensor/camera"
      streams:
        rgb: true
        depth: false

  # 数据缓存配置
  buffers:
    action_buffer_size: 200
    state_buffer_size: 30
    camera_buffer_size: 30

  # 数据同步配置
  sync:
    block_timeout: 100.0
    check_interval: 0.01
    timestamp_tolerance: 0.0015
    sync_target: "image"  # 同步目标: qpos 或 image

mapping:
  # 注意：模型训练时使用的是单臂（7维：6 dof + 1 gripper）
  # 如果使用双臂，需要确保模型支持14维状态
  model_arm_order: ["right_arm"]  # 单臂模式，只使用right_arm
  model_arm_dof: 6
  use_gripper: true
  fill_missing_arm: false  # 单臂模式不需要填充

  model_obs_map:
    observation.images.image: "front"              # 模型主相机图像 <- datacenter的front相机
    observation.images.wrist_image: "wrist_right"  # 模型手腕图像 <- datacenter的wrist_right相机
    observation.state: "qpos"                      # 模型状态 <- datacenter的qpos数据

  image:
    normalize: true
    channel_order: "rgb"       # 通道顺序: rgb|bgr
    expected_size: [320, 240]  # 期望图像尺寸: 宽, 高
    resize: true              # 尺寸不匹配时是否缩放
